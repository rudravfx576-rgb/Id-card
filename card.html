<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f2f2;font-family:Arial,sans-serif}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:360px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 5px 20px #0002}
.header{background:#111;color:#fff;text-align:center;padding:14px 10px}
.header h2{margin:0;font-size:20px}
.header p{margin:4px 0 0;font-size:12px}
.body{padding:18px}
.photo{width:105px;height:125px;margin:0 auto 12px;border:2px solid #111;border-radius:8px;overflow:hidden;text-align:center;background:#eee}
.photo img{width:100%;height:100%;object-fit:cover}
.name{text-align:center;font-size:21px;font-weight:700;margin:8px 0 15px}
.info{font-size:14px;line-height:1.8}
.info b{display:inline-block;width:105px}
.id{text-align:center;font-weight:700;margin-top:12px}
.qr{text-align:center;margin-top:15px}
.qr img{width:125px;height:125px}
.note{text-align:center;font-size:11px;color:#666;margin-top:10px}
.error{text-align:center;padding:50px 20px;font-weight:700}
button{display:block;margin:16px auto 0;padding:10px 18px;border:0;border-radius:8px;background:#111;color:#fff;cursor:pointer}
@media print{
 body{background:#fff}
 .wrap{padding:0}
 .card{box-shadow:none}
 button{display:none}
}
</style>
</head>
