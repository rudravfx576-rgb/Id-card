function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
const id=(new URLSearchParams(location.search).get('id')||'').trim();
const m=MEMBERS.find(x=>String(x.id).trim()===id);
const app=document.getElementById('app');
if(!m){
 app.innerHTML='<h2>Member not found</h2><p class="error">Invalid or missing Member ID.</p>';
}else{
 app.innerHTML=`<div class="card" id="card">
 <div class="title">Maa Khambeswari Youth Club</div>

 <div class="center"><button onclick="downloadPDF()">Download PDF</button></div>`;
 new QRCode(document.getElementById('qr'),{text:location.href,width:62,height:62,colorDark:'#123b6d',colorLight:'#fff'});
}
async function downloadPDF(){
 const canvas=await html2canvas(document.getElementById('card'),{scale:3,backgroundColor:'#fff'});
 const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'landscape',unit:'mm',format:[86,54]});
 pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,86,54);pdf.save(m.id+'-'+m.name.replace(/\s+/g,'_')+'.pdf');
}
